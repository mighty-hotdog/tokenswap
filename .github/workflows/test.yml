name: CI

permissions: {}

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Foundry project
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install / update Foundry
        uses: foundry-rs/foundry-toolchain@v1
        run: |
          # 1. Download and run the raw installer script
          curl -L https://foundry.paradigm.xyz | bash
          
          # 2. Append the binary directory directly to the global GitHub runner path
          echo "$HOME/.foundry/bin" >> $GITHUB_PATH
          
          # 3. Synchronize path variable updates for the current active environment shell context
          export PATH="$HOME/.foundry/bin:$PATH"
          
          # 4. Initialize foundryup safely
          foundryup

      - name: Show Forge version
        run: forge --version

      #- name: Run Forge fmt
      #  run: forge fmt --check

      - name: Run Forge build
        run: forge build --sizes

      - name: Run Forge tests
        run: forge test -vvv
